name: touchline
services:
  app:
    image: ${TOUCHLINE_IMAGE:-touchline:local}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3210}:3210"
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SERVER_JOIN_KEY: ${SERVER_JOIN_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-none}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
