name: Deploy to my PC
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touchline-home-server
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, Windows, X64, touchline]
    environment: home-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Test on host
        shell: pwsh
        run: |
          node scripts/check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Syntax checks failed' }
          node --test --test-concurrency=1
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Deploy with backup and health check
        shell: pwsh
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if (-not $env:DEPLOY_ROOT) { throw 'Set the home-server DEPLOY_ROOT variable first.' }
          ./scripts/Deploy.ps1 -DeployRoot $env:DEPLOY_ROOT -Revision $env:DEPLOY_SHA
